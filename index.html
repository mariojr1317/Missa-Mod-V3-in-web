<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FNF Web Converter V10</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header>
        <h1>🎵 FNF Web Converter</h1>

        <p>
            ZIP completo del juego → análisis → proyecto web
        </p>

        <span class="version">
            V10 FULL ZIP
        </span>
    </header>


    <section class="card">

        <h2>📦 Cargar ZIP completo</h2>

        <p>
            Selecciona el ZIP completo que contiene
            los archivos extraídos del juego.
        </p>

        <label
            id="zipDrop"
            class="drop-zone"
        >

            <div class="drop-icon">
                📁
            </div>

            <strong>
                Seleccionar ZIP
            </strong>

            <span>
                Puedes cargar el ZIP completo del juego
            </span>

            <input
                id="zipInput"
                type="file"
                accept=".zip"
            >

        </label>

        <div class="buttons">

            <button
                id="analyzeButton"
                disabled
            >
                🔎 ANALIZAR TODO
            </button>

            <button
                id="buildButton"
                disabled
            >
                🌐 GENERAR PROYECTO WEB
            </button>

        </div>

    </section>


    <section class="card">

        <h2>📊 Análisis</h2>

        <div id="progressContainer">
            <div id="progressBar"></div>
        </div>

        <pre id="status">Esperando ZIP...</pre>

        <div id="results"></div>

    </section>


    <section
        id="fileListCard"
        class="card hidden"
    >

        <h2>📂 Archivos encontrados</h2>

        <input
            id="search"
            type="search"
            placeholder="Buscar archivo..."
        >

        <div id="fileList"></div>

    </section>


    <footer>
        Todos los archivos del ZIP se conservan.
    </footer>

</div>


<script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>

<script src="./converter.js?v=10"></script>

</body>
</html>
