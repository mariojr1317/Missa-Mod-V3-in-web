<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>FNF EXE → HTML5</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#0d0d0d;
    color:#fff;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    padding:30px 15px;
}

.app{
    width:100%;
    max-width:900px;
}

h1{
    text-align:center;
    font-size:42px;
}

.subtitle{
    text-align:center;
    color:#aaa;
}

.card{
    background:#181818;
    border:1px solid #333;
    border-radius:18px;
    padding:25px;
    margin-top:25px;
}

.drop{
    min-height:220px;
    border:3px dashed #555;
    border-radius:16px;

    flex-direction:column;

    text-align:center;

}

.drop:hover,
.drop.drag{
    background:#222;
    border-color:#fff;
}

.icon{
    font-size:65px;
}

#file{
    display:none;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:20px;
}

button{
    flex:1;
    min-width:220px;
    padding:14px;
    border:0;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
    font-size:16px;
}

button:disabled{
    opacity:.4;
    cursor:not-allowed;
}

#status{
    margin-top:20px;
    background:#090909;
    padding:18px;
    border-radius:10px;
    white-space:pre-wrap;
    font-family:monospace;
}

.results{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:10px;
    margin-top:20px;
}

.result{
    background:#222;
    border-radius:10px;
    padding:15px;
}

.good{
    border-left:4px solid #4caf50;
}

.warn{
    border-left:4px solid #ff9800;
}

.progress{
    width:100%;
    height:10px;
    background:#333;
    border-radius:20px;
    overflow:hidden;
    margin-top:20px;
}

.bar{
    height:100%;
    width:0%;
    background:#fff;
    transition:.1s;
}
</style>
</head>

<body>

<div class="app">

    <h1>🎵 FNF EXE → HTML5</h1>

    <div class="subtitle">
        Extractor experimental para FNF / Psych Engine
    </div>

    <div class="card">

        <label
            class="drop"
            id="drop"
        >

            <div class="icon">📦</div>

            <strong>
                Selecciona MissaMod.exe
            </strong>

            <span>
                o arrástralo aquí
            </span>

            <input
                id="file"
                type="file"
                accept=".exe"
            >

        </label>

        <div class="buttons">

            <button
                id="analyze"
                disabled
            >
                🔎 Analizar
            </button>

            <button
                id="extract"
                disabled
            >
                🚀 EXTRAER Y GENERAR ZIP
            </button>

        </div>

        <div class="progress">
            <div
                class="bar"
                id="bar"
            ></div>
        </div>

        <div id="status">
            Página cargada correctamente.
        </div>

        <div
            class="results"
            id="results"
        ></div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>

<script>

"use strict";


const fileInput =
    document.getElementById("file");

const drop =
    document.getElementById("drop");

const analyzeButton =
    document.getElementById("analyze");

const extractButton =
    document.getElementById("extract");

const status =
    document.getElementById("status");

const results =
    document.getElementById("results");

const bar =
    document.getElementById("bar");

let file = null;
let bytes = null;
let analysis = null;


/* ============================================================
   UTILIDADES
============================================================ */

function setStatus(text)
{
    status.textContent = text;
}


function setProgress(value)
{
    bar.style.width =
        `${value}%`;
}


function bytesToMB(value)
{
    return (
        value /
        1024 /
        1024
    ).toFixed(2);
}


function signature(
    bytes,
    offset,
    sig
)
{
    if (
        offset +
        sig.length >
        bytes.length
    )
    {
        return false;
    }

    for (
        let i = 0;
        i < sig.length;
        i++
    )
    {
        if (
            bytes[offset + i] !==
            sig[i]
        )
        {
            return false;
        }
    }

    return true;
}


function find(
    bytes,
    sig,
    start = 0
)
{
    for (
        let i = start;
        i + sig.length <= bytes.length;
        i++
    )
    {
        if (
            signature(
                bytes,
                i,
                sig
            )
        )
        {
            return i;
        }
    }

    return -1;
}


function u32(
    bytes,
    offset
)
{
    return (
        bytes[offset] |
        (bytes[offset + 1] << 8) |
        (bytes[offset + 2] << 16) |
        (bytes[offset + 3] << 24)
    ) >>> 0;
}


function textBytes(text)
{
    return Uint8Array.from(
        [...text].map(
            c => c.charCodeAt(0)
        )
    );
}


/* ============================================================
   ARCHIVO
============================================================ */

drop.addEventListener(
    "click",
    () => fileInput.click()
);


fileInput.addEventListener(
    "change",
    () =>
    {
        if (!fileInput.files.length)
            return;

        selectFile(
            fileInput.files[0]
        );
    }
);


drop.addEventListener(
    "dragover",
    event =>
    {
        event.preventDefault();

        drop.classList.add(
            "drag"
        );
    }
);


drop.addEventListener(
    "dragleave",
    () =>
    {
        drop.classList.remove(
            "drag"
        );
    }
);


drop.addEventListener(
    "drop",
    event =>
    {
        event.preventDefault();

        drop.classList.remove(
            "drag"
        );

        if (
            !event.dataTransfer.files.length
        )
        {
            return;
        }

        selectFile(
            event.dataTransfer.files[0]
        );
    }
);


async function selectFile(selected)
{
    file = selected;

    setStatus(
        `📦 ${file.name}\n` +
        `Tamaño: ${bytesToMB(
            file.size
        )} MB\n\n` +
        `Pulsa ANALIZAR.`
    );

    analyzeButton.disabled =
        false;

    extractButton.disabled =
        true;

    results.innerHTML =
        "";
}


/* ============================================================
   ANÁLISIS
============================================================ */

analyzeButton.addEventListener(
    "click",
    async () =>
    {
        if (!file)
            return;

        analyzeButton.disabled =
            true;

        setStatus(
            "📥 Leyendo el EXE..."
        );

        try
        {
            const buffer =
                await file.arrayBuffer();

            bytes =
                new Uint8Array(
                    buffer
                );

            setProgress(15);

            analysis =
                analyzeGame(
                    bytes
                );

            setProgress(100);

            showResults();

            extractButton.disabled =
                false;

            setStatus(
                "✅ Análisis terminado.\n\n" +
                `EXE: ${file.name}\n` +
                `Tamaño: ${bytesToMB(
                    bytes.length
                )} MB`
            );

        }
        catch(error)
        {
            console.error(error);

            setStatus(
                "❌ Error:\n" +
                error.message
            );
        }
        finally
        {
            analyzeButton.disabled =
                false;
        }
    }
);


/* ============================================================
   DETECCIÓN
============================================================ */

function analyzeGame(bytes)
{
    const pe =
        signature(
            bytes,
            0,
            [0x4D,0x5A]
        );

    const fnf =
        find(
            bytes,
            textBytes(
                "Friday Night Funkin"
            )
        ) !== -1 ||
        find(
            bytes,
            textBytes("funkin")
        ) !== -1;

    const psych =
        find(
            bytes,
            textBytes(
                "Psych Engine"
            )
        ) !== -1 ||
        find(
            bytes,
            textBytes(
                "PsychEngine"
            )
        ) !== -1;

    const haxe =
        find(
            bytes,
            textBytes("Haxe")
        ) !== -1;

    const flixel =
        find(
            bytes,
            textBytes("HaxeFlixel")
        ) !== -1 ||
        find(
            bytes,
            textBytes("flixel")
        ) !== -1;

    const png =
        count(
            bytes,
            [
                0x89,
                0x50,
                0x4E,
                0x47,
                0x0D,
                0x0A,
                0x1A,
                0x0A
            ]
        );

    const jpg =
        count(
            bytes,
            [
                0xFF,
                0xD8,
                0xFF
            ]
        );

    const ogg =
        count(
            bytes,
            [
                0x4F,
                0x67,
                0x67,
                0x53
            ]
        );

    const zip =
        count(
            bytes,
            [
                0x50,
                0x4B,
                0x03,
                0x04
            ]
        );

    const wav =
        count(
            bytes,
            [
                0x52,
                0x49,
                0x46,
                0x46
            ]
        );

    return {
        pe,
        fnf,
        psych,
        haxe,
        flixel,
        png,
        jpg,
        ogg,
        zip,
        wav
    };
}


function count(
    bytes,
    sig
)
{
    let total = 0;

    let pos = 0;

    while(true)
    {
        const found =
            find(
                bytes,
                sig,
                pos
            );

        if(found === -1)
            break;

        total++;

        pos =
            found +
            sig.length;
    }

    return total;
}


function showResults()
{
    results.innerHTML =
        "";

    result(
        "PE",
        analysis.pe
            ? "✅ Válido"
            : "❌ No detectado",
        analysis.pe
    );

    result(
        "FNF",
        analysis.fnf
            ? "✅ Detectado"
            : "❌ No detectado",
        analysis.fnf
    );

    result(
        "Psych Engine",
        analysis.psych
            ? "✅ Detectado"
            : "⚠️ No confirmado",
        analysis.psych
    );

    result(
        "HaxeFlixel",
        analysis.flixel
            ? "✅ Detectado"
            : "⚠️ No confirmado",
        analysis.flixel
    );

    result(
        "PNG reales",
        analysis.png,
        true
    );

    result(
        "JPEG reales",
        analysis.jpg,
        true
    );

    result(
        "OGG reales",
        analysis.ogg,
        true
    );

    result(
        "RIFF/WAV",
        analysis.wav,
        true
    );

    result(
        "ZIP",
        analysis.zip,
        true
    );
}


function result(
    title,
    value,
    good
)
{
    const div =
        document.createElement(
            "div"
        );

    div.className =
        "result " +
        (
            good
                ? "good"
                : "warn"
        );

    div.innerHTML =
        `<strong>${title}</strong><br>${value}`;

    results.appendChild(
        div
    );
}


/* ============================================================
   EXTRACCIÓN REAL
============================================================ */

extractButton.addEventListener(
    "click",
    async () =>
    {
        if (
            !bytes ||
            !analysis
        )
        {
            return;
        }

        extractButton.disabled =
            true;

        setStatus(
            "🚀 Extrayendo recursos reales..."
        );

        try
        {
            const extracted =
                await extractAssets(
                    bytes
                );

            setProgress(90);

            setStatus(
                "📦 Construyendo MissaWeb.zip..."
            );

            const zip =
                buildZip(
                    extracted
                );

            const blob =
                new Blob(
                    [zip],
                    {
                        type:
                            "application/zip"
                    }
                );

            const url =
                URL.createObjectURL(
                    blob
                );

            const link =
                document.createElement(
                    "a"
                );

            link.href =
                url;

            link.download =
                "MissaWeb.zip";

            document.body.appendChild(
                link
            );

            link.click();

            link.remove();

            setProgress(100);

            setStatus(
                "✅ TERMINADO\n\n" +
                `Archivos extraídos: ${
                    extracted.length
                }\n\n` +
                "MissaWeb.zip fue descargado."
            );

        }
        catch(error)
        {
            console.error(error);

            setStatus(
                "❌ Error durante la extracción:\n\n" +
                error.message
            );
        }
        finally
        {
            extractButton.disabled =
                false;
        }
    }
);


/* ============================================================
   PNG
============================================================ */

function extractPNG(
    bytes,
    start
)
{
    const iend =
        textBytes(
            "IEND"
        );

    const end =
        find(
            bytes,
            iend,
            start + 8
        );

    if(end === -1)
        return null;

    const finish =
        end + 8;

    return bytes.slice(
        start,
        finish
    );
}


/* ============================================================
   JPG
============================================================ */

function extractJPG(
    bytes,
    start
)
{
    for(
        let i = start + 3;
        i + 1 < bytes.length;
        i++
    )
    {
        if(
            bytes[i] === 0xFF &&
            bytes[i + 1] === 0xD9
        )
        {
            return bytes.slice(
                start,
                i + 2
            );
        }
    }

    return null;
}


/* ============================================================
   WAV
============================================================ */

function extractWAV(
    bytes,
    start
)
{
    if(
        !signature(
            bytes,
            start,
            textBytes("RIFF")
        )
    )
    {
        return null;
    }

    if(
        !signature(
            bytes,
            start + 8,
            textBytes("WAVE")
        )
    )
    {
        return null;
    }

    const size =
        u32(
            bytes,
            start + 4
        );

    const end =
        start +
        8 +
        size;

    if(
        end >
        bytes.length
    )
    {
        return null;
    }

    return bytes.slice(
        start,
        end
    );
}


/* ============================================================
   WEBP
============================================================ */

function extractWEBP(
    bytes,
    start
)
{
    if(
        !signature(
            bytes,
            start + 8,
            textBytes("WEBP")
        )
    )
    {
        return null;
    }

    const size =
        u32(
            bytes,
            start + 4
        );

    const end =
        start +
        8 +
        size;

    if(
        end >
        bytes.length
    )
    {
        return null;
    }

    return bytes.slice(
        start,
        end
    );
}


/* ============================================================
   OGG
============================================================ */

function extractOGG(
    bytes,
    start
)
{
    let pos =
        start;

    while(
        pos + 27 <=
        bytes.length
    )
    {
        if(
            !signature(
                bytes,
                pos,
                [
                    0x4F,
                    0x67,
                    0x67,
                    0x53
                ]
            )
        )
        {
            return null;
        }

        const headerType =
            bytes[pos + 5];

        const segments =
            bytes[pos + 26];

        const table =
            pos + 27;

        const payload =
            table +
            segments;

        if(
            payload >
            bytes.length
        )
        {
            return null;
        }

        let payloadSize =
            0;

        for(
            let i = 0;
            i < segments;
            i++
        )
        {
            payloadSize +=
                bytes[
                    table + i
                ];
        }

        const pageEnd =
            payload +
            payloadSize;

        if(
            pageEnd >
            bytes.length
        )
        {
            return null;
        }

        if(
            headerType & 0x04
        )
        {
            return bytes.slice(
                start,
                pageEnd
            );
        }

        pos =
            pageEnd;
    }

    return null;
}


/* ============================================================
   EXTRACTOR
============================================================ */

async function extractAssets(bytes)
{
    const output = [];

    let position = 0;

    const pngSig =
    [
        0x89,
        0x50,
        0x4E,
        0x47,
        0x0D,
        0x0A,
        0x1A,
        0x0A
    ];

    const jpgSig =
    [
        0xFF,
        0xD8,
        0xFF
    ];

    const oggSig =
    [
        0x4F,
        0x67,
        0x67,
        0x53
    ];

    const riffSig =
    [
        0x52,
        0x49,
        0x46,
        0x46
    ];

    let images = 0;
    let audio = 0;
    let other = 0;


    while(true)
    {
        const p =
            find(
                bytes,
                pngSig,
                position
            );

        if(p === -1)
            break;

        const data =
            extractPNG(
                bytes,
                p
            );

        if(data)
        {
            images++;

            output.push(
            {
                path:
                    `assets/images/image_${images}.png`,

                data
            });

            position =
                p +
                data.length;
        }
        else
        {
            position =
                p + 8;
        }
    }


    position = 0;

    while(true)
    {
        const p =
            find(
                bytes,
                jpgSig,
                position
            );

        if(p === -1)
            break;

        const data =
            extractJPG(
                bytes,
                p
            );

        if(data)
        {
            images++;

            output.push(
            {
                path:
                    `assets/images/image_${images}.jpg`,

                data
            });

            position =
                p +
                data.length;
        }
        else
        {
            position =
                p + 3;
        }
    }


    position = 0;

    while(true)
    {
        const p =
            find(
                bytes,
                riffSig,
                position
            );

        if(p === -1)
            break;

        let data = null;
        let extension = null;

        if(
            signature(
                bytes,
                p + 8,
                textBytes("WAVE")
            )
        )
        {
            data =
                extractWAV(
                    bytes,
                    p
                );

            extension = "wav";
        }
        else if(
            signature(
                bytes,
                p + 8,
                textBytes("WEBP")
            )
        )
        {
            data =
                extractWEBP(
                    bytes,
                    p
                );

            extension = "webp";
        }

        if(data)
        {
            images++;

            output.push(
            {
                path:
                    extension === "wav"
                    ? `assets/audio/audio_${audio + 1}.wav`
                    : `assets/images/image_${images}.webp`,

                data
            });

            if(
                extension === "wav"
            )
            {
                audio++;
            }

            position =
                p +
                data.length;
        }
        else
        {
            position =
                p + 4;
        }
    }


    position = 0;

    while(true)
    {
        const p =
            find(
                bytes,
                oggSig,
                position
            );

        if(p === -1)
            break;

        const data =
            extractOGG(
                bytes,
                p
            );

        if(data)
        {
            audio++;

            output.push(
            {
                path:
                    `assets/audio/audio_${audio}.ogg`,

                data
            });

            position =
                p +
                data.length;
        }
        else
        {
            position =
                p + 4;
        }
    }


    return output;
}


/* ============================================================
   ZIP STORE
============================================================ */

function crc32(data)
{
    let crc =
        0xFFFFFFFF;

    for(
        let i = 0;
        i < data.length;
        i++
    )
    {
        crc ^=
            data[i];

        for(
            let j = 0;
            j < 8;
            j++
        )
        {
            crc =
                (
                    crc >>> 1
                ) ^
                (
                    crc & 1
                        ? 0xEDB88320
                        : 0
                );
        }
    }

    return (
        crc ^
        0xFFFFFFFF
    ) >>> 0;
}


function push16(
    arr,
    value
)
{
    arr.push(
        value & 255,
        (value >>> 8) & 255
    );
}


function push32(
    arr,
    value
)
{
    arr.push(
        value & 255,
        (value >>> 8) & 255,
        (value >>> 16) & 255,
        (value >>> 24) & 255
    );
}


function makeZip(
    files
)
{
    const output = [];
    const central = [];

    let offset = 0;

    for(
        const file of files
    )
    {
        const name =
            new TextEncoder()
                .encode(
                    file.name
                );

        const data =
            file.data;

        const crc =
            crc32(
                data
            );

        const local = [];

        push32(
            local,
            0x04034B50
        );

        push16(local,20);
        push16(local,0);
        push16(local,0);
        push16(local,0);
        push16(local,0);

        push32(
            local,
            crc
        );

        push32(
            local,
            data.length
        );

        push32(
            local,
            data.length
        );

        push16(
            local,
            name.length
        );

        push16(
            local,
            0
        );

        for(
            const b of name
        )
        {
            local.push(b);
        }

        for(
            const b of data
        )
        {
            local.push(b);
        }

        for(
            const b of local
        )
        {
            output.push(b);
        }


        const centralEntry = [];

        push32(
            centralEntry,
            0x02014B50
        );

        push16(centralEntry,20);
        push16(centralEntry,20);
        push16(centralEntry,0);
        push16(centralEntry,0);
        push16(centralEntry,0);
        push16(centralEntry,0);

        push32(
            centralEntry,
            crc
        );

        push32(
            centralEntry,
            data.length
        );

        push32(
            centralEntry,
            data.length
        );

        push16(
            centralEntry,
            name.length
        );

        push16(
            centralEntry,
            0
        );

        push16(
            centralEntry,
            0
        );

        push16(
            centralEntry,
            0
        );

        push16(
            centralEntry,
            0
        );

        push32(
            centralEntry,
            0
        );

        push32(
            centralEntry,
            offset
        );

        for(
            const b of name
        )
        {
            centralEntry.push(b);
        }

        central.push(
            centralEntry
        );

        offset +=
            local.length;
    }


    const centralOffset =
        output.length;

    let centralSize =
        0;

    for(
        const entry of central
    )
    {
        for(
            const b of entry
        )
        {
            output.push(b);
        }

        centralSize +=
            entry.length;
    }


    push32(
        output,
        0x06054B50
    );

    push16(output,0);
    push16(output,0);
    push16(output,files.length);
    push16(output,files.length);

    push32(
        output,
        centralSize
    );

    push32(
        output,
        centralOffset
    );

    push16(
        output,
        0
    );


    return new Uint8Array(
        output
    );
}


/* ============================================================
   CONSTRUIR ZIP
============================================================ */

function buildZip(
    extracted
)
{
    const files = [];


    files.push(
    {
        name:
            "index.html",

        data:
            new TextEncoder()
                .encode(
`<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Missa V3 Web</title>
</head>
<body>
<h1>MISSA V3 WEB</h1>
<p>Proyecto generado desde un EXE de FNF.</p>
<p>Los recursos extraídos están en assets/.</p>
</body>
</html>`
                )
    });


    files.push(
    {
        name:
            "README.txt",

        data:
            new TextEncoder()
                .encode(
`MISSA V3 WEB

Los archivos de assets incluidos en este
proyecto fueron extraídos mediante firmas
binarias reales desde el EXE.

Esto NO significa que el código compilado
del Psych Engine haya sido convertido.

El siguiente paso es interpretar los datos
y reconstruir el runtime FNF para navegador.
`
                )
    });


    files.push(
    {
        name:
            "manifest.json",

        data:
            new TextEncoder()
                .encode(
                    JSON.stringify(
                    {
                        original:
                            file.name,

                        engine:
                            "Psych Engine / HaxeFlixel",

                        extracted:
                            extracted.map(
                                item =>
                                ({
                                    path:
                                        item.path,

                                    size:
                                        item.data.length
                                })
                            )
                    },
                    null,
                    4
                    )
                )
    });


    for(
        const item of extracted
    )
    {
        files.push(
        {
            name:
                item.path,

            data:
                item.data
        });
    }


    return makeZip(
        files
    );
}
