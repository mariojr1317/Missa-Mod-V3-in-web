<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FNF Web Converter V7</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header>
        <h1>🎵 FNF Web Converter</h1>

        <p>
            EXE de FNF → recursos → proyecto HTML5
        </p>

        <span class="version">
            V7 MULTIMEDIA EXTRACTOR
        </span>
    </header>

    <main class="card">

        <label id="dropZone" class="drop-zone">

            <div class="drop-icon">
                📦
            </div>

            <strong>
                Selecciona tu MissaMod.exe
            </strong>

            <span>
                o arrastra el EXE aquí
            </span>

            <input
                id="fileInput"
                type="file"
                accept=".exe"
            >

        </label>

        <div class="buttons">

            <button
                id="analyzeButton"
                disabled
            >
                🔎 Analizar
            </button>

            <button
                id="extractButton"
                disabled
            >
                🚀 EXTRAER Y GENERAR ZIP
            </button>

        </div>

        <div class="progress">
            <div id="progressBar"></div>
        </div>

        <pre id="status">Esperando archivo...</pre>

        <div id="results"></div>

    </main>

    <footer>
        Procesamiento local en el navegador.
    </footer>

</div>

<script>
    document.getElementById("status").textContent =
        "✅ JavaScript de la página funciona.\n\nCargando conversor...";

    window.addEventListener("error", function (event) {
        document.getElementById("status").textContent =
            "❌ ERROR EN CONVERTER.JS:\n\n" +
            event.message;
    });
</script>

<script src="./converter.js?v=7"></script>

<script>
    document.getElementById("status").textContent =
        "✅ FNF Web Converter V7 cargado.\n\nSelecciona tu EXE.";
</script>

</body>
</html>
