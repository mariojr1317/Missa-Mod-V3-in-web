<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FNF Web Converter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="container">

    <h1>🎵 FNF Web Converter</h1>

    <p>
        Convierte y prepara un proyecto web a partir de un EXE de FNF.
    </p>

    <label id="dropZone" class="drop-zone">

        <span class="big">📦</span>

        <strong>Selecciona MissaMod.exe</strong>

        <span>
            o arrastra aquí el archivo
        </span>

        <input
            id="fileInput"
            type="file"
            accept=".exe"
        >

    </label>

    <button id="analyzeButton">
        🔎 Analizar
    </button>

    <button
        id="convertButton"
        disabled
    >
        🌐 Generar proyecto HTML5
    </button>

    <section id="status">
        Esperando archivo...
    </section>

    <section id="results"></section>

</main>

<script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
<script src="converter.js"></script>

</body>
</html>
