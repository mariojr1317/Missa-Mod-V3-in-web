<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FNF Web Converter V7</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header>
        <h1>🎵 FNF Web Converter</h1>

        </p>

        <span class="version">
            V7 MULTIMEDIA EXTRACTOR
        </span>
    </header>

    <main class="card">

        <label id="dropZone" class="drop-zone">

            <div class="drop-icon">
                📦

                Selecciona tu MissaMod.exe
            </strong>

            <span>
                o arrastra el EXE aquí
            </span>

        <div class="buttons">

                id="analyzeButton"

            </button>

        </div>

        <div class="progress">

        </div>

        <pre id="status">Esperando archivo...</pre>

        <div id="results"></div>

    </main>

</div>
