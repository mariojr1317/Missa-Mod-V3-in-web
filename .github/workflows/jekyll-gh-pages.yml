name: Build FNF Web Converter

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:

jobs:
  build:
    name: Build C++ Converter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Build
        run: |
          mkdir -p build

          g++ \
            -std=c++17 \
            -O2 \
            -Wall \
            -Wextra \
            src/main.cpp \
            -o build/FNFWebConverter

      - name: Test executable
        run: |
          ./build/FNFWebConverter || true

      - name: Upload converter
        uses: actions/upload-artifact@v4
        with:
          name: FNF-Web-Converter
          path: build/FNFWebConverter
